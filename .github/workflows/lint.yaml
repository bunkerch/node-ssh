name: Lint

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: bunkerch-sysbox
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.19.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

            - name: Build
              run: pnpm build
