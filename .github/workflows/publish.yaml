name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: bunkerch-sysbox
        timeout-minutes: 60
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  ref: ${{ github.event.release.tag_name }}

            - name: Install system test tools
              run: >-
                  sudo apt-get update &&
                  sudo apt-get install --yes libatomic1 putty-tools softhsm2

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.19.0

            - name: Setup Node.js and npm registry
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install current npm CLI
              run: npm install --global npm@latest

            - name: Validate release metadata
              id: release
              env:
                  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from "node:fs"

                  const packageJson = JSON.parse(readFileSync("package.json", "utf8"))
                  const expectedTag = `v${packageJson.version}`
                  if (process.env.RELEASE_TAG !== expectedTag) {
                      throw new Error(`Release tag must be ${expectedTag}, received ${process.env.RELEASE_TAG}`)
                  }

                  const versionIsPrerelease = packageJson.version.includes("-")
                  const releaseIsPrerelease = process.env.RELEASE_PRERELEASE === "true"
                  if (versionIsPrerelease !== releaseIsPrerelease) {
                      throw new Error(
                          `Version ${packageJson.version} and the GitHub prerelease setting must agree`,
                      )
                  }

                  appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${releaseIsPrerelease ? "next" : "latest"}\n`)
                  NODE

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build documentation
              run: pnpm docs:build

            - name: Build package archive
              id: package
              run: |
                  mkdir -p "$RUNNER_TEMP/npm-package"
                  archive="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package")"
                  archive_path="$RUNNER_TEMP/npm-package/$archive"
                  test -f "$archive_path"
                  echo "archive=$archive_path" >> "$GITHUB_OUTPUT"

            - name: Publish package archive
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: >-
                  npm publish "${{ steps.package.outputs.archive }}"
                  --ignore-scripts
                  --access public
                  --registry https://registry.npmjs.org/
                  --tag "${{ steps.release.outputs.npm-tag }}"
